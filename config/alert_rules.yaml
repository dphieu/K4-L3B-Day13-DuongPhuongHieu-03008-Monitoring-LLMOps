alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-03008
    runbook: docs/alerts.md#highlatencyp95
  - name: HighErrorRate
    severity: critical
    condition: 'error_rate(request_failed, request_received) > 2%'
    duration: 3m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-03008
    runbook: docs/alerts.md#higherrorrate
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'retrieval_success_rate(response_sent.tool_success) < 90%'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-03008
    runbook: docs/alerts.md#lowretrievalsuccess
